<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Control</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      padding: 24px;
    }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .kpi-card h4 {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .kpi-card .value {
      font-size: 24px;
      font-weight: 700;
    }

    .kpi-card .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Controles de Filtros y Orden */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--surface);
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      align-items: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
    }

    select, input {
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      background: #FFF;
      color: var(--text-main);
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--primary);
    }

    /* Contenedor con Scroll Horizontal Garantizado */
    .table-viewport {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-top: none;
      background: var(--surface);
      border-radius: 0 0 8px 8px;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 980px; /* Previene el colapso de columnas */
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      background: #F1F5F9;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      position: sticky;
      top: 0;
    }

    tr:hover {
      background-color: #F8FAFC;
    }

    /* Checkbox Centrado */
    .checkbox-cell {
      text-align: center;
      width: 60px;
    }

    .checkbox-cell input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    /* Badges con Paleta Pastel */
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-estado-pendiente { background-color: #FEF3C7; color: #92400E; }
    .badge-estado-aprobado { background-color: #DCFCE7; color: #166534; }
    
    .badge-prioridad-alta { background-color: #FEE2E2; color: #991B1B; }
    .badge-prioridad-intermedia { background-color: #FEF9C3; color: #854D0E; }

    /* Paleta Pastel Dinámica para Unidades */
    .unit-p1 { background-color: #E0F2FE; color: #0369A1; } /* Celeste */
    .unit-p2 { background-color: #EDE9FE; color: #5B21B6; } /* Lavanda */
    .unit-p3 { background-color: #DCFCE7; color: #15803D; } /* Menta */
    .unit-p4 { background-color: #FCE7F3; color: #9D174D; } /* Rosa */
    .unit-p5 { background-color: #FFEDD5; color: #9A3412; } /* Melocotón */
    .unit-default { background-color: #F1F5F9; color: #475569; }

    .numeric {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <!-- KPI Grid -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <h4>En Reprogramación</h4>
      <div class="value" id="kpi-reprog-count">0</div>
      <div class="subtitle">18% del total</div>
    </div>
    <div class="kpi-card">
      <h4>Total Presupuesto USD</h4>
      <div class="value" id="kpi-total-usd">$0.00</div>
      <div class="subtitle">Consolidado a fecha base</div>
    </div>
    <div class="kpi-card">
      <h4>Total Presupuesto ARS</h4>
      <div class="value" id="kpi-total-ars">$0</div>
      <div class="subtitle">Calculado con TC histórico</div>
    </div>
  </div>

  <!-- Controles: Filtros y Ordenamiento -->
  <div class="toolbar">
    <div class="form-group">
      <label>Estado</label>
      <select id="filter-estado" onchange="applyFiltersAndRender()">
        <option value="">Todos</option>
        <option value="Pendiente">Pendiente</option>
        <option value="Aprobado">Aprobado</option>
      </select>
    </div>

    <div class="form-group">
      <label>Prioridad</label>
      <select id="filter-prioridad" onchange="applyFiltersAndRender()">
        <option value="">Todas</option>
        <option value="Alta">Alta</option>
        <option value="Intermedia">Intermedia</option>
        <option value="Sin asignar">Sin asignar</option>
      </select>
    </div>

    <div class="form-group">
      <label>Ordenar Por</label>
      <select id="sort-field" onchange="applyFiltersAndRender()">
        <option value="fecha">Fecha</option>
        <option value="semana">Semana</option>
      </select>
    </div>

    <div class="form-group">
      <label>Dirección</label>
      <select id="sort-direction" onchange="applyFiltersAndRender()">
        <option value="asc">Ascendente</option>
        <option value="desc">Descendente</option>
      </select>
    </div>
  </div>

  <!-- Vista de Tabla con Scroll Horizontal -->
  <div class="table-viewport">
    <table id="data-table">
      <thead>
        <tr>
          <th>Fecha (Col A)</th>
          <th>Semana</th>
          <th>Unidad</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th>Prioridad</th>
          <th class="numeric">Presupuesto USD</th>
          <th class="numeric">TC Histórico</th>
          <th class="numeric">Presupuesto ARS</th>
          <th class="checkbox-cell">Compras</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="10" style="text-align:center;">Cargando registros...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let rawDataset = [];

    // Mapeo determinístico de Unidades a Paleta Pastel
    const unitPaletteMap = {
      'PLANTA 1': 'unit-p1',
      'PLANTA 2': 'unit-p2',
      'LINEA A':  'unit-p3',
      'LINEA B':  'unit-p4',
      'SERVICIOS': 'unit-p5'
    };

    window.onload = function() {
      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(onError)
        .getDataset();
    };

    function onDataLoaded(data) {
      rawDataset = data;
      applyFiltersAndRender();
      calculateKPIs(data);
    }

    function onError(err) {
      document.getElementById('table-body').innerHTML = 
        `<tr><td colspan="10" style="color:red; text-align:center;">Error: ${err.message}</td></tr>`;
    }

    function calculateKPIs(data) {
      let sumUSD = 0;
      let sumARS = 0;
      data.forEach(d => {
        sumUSD += d.presupuestoUSD || 0;
        sumARS += d.presupuestoARS || 0;
      });

      document.getElementById('kpi-total-usd').innerText = 'USD ' + sumUSD.toLocaleString('es-AR', { minimumFractionDigits: 2 });
      document.getElementById('kpi-total-ars').innerText = '$ ' + sumARS.toLocaleString('es-AR', { maximumFractionDigits: 0 });
      document.getElementById('kpi-reprog-count').innerText = data.filter(d => d.estado === 'Pendiente').length;
    }

    function getWeekNumber(dateString) {
      if (!dateString) return 0;
      const date = new Date(dateString + 'T00:00:00');
      const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
      const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
      return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
    }

    function applyFiltersAndRender() {
      const estadoFilter = document.getElementById('filter-estado').value;
      const prioridadFilter = document.getElementById('filter-prioridad').value;
      const sortField = document.getElementById('sort-field').value;
      const sortDir = document.getElementById('sort-direction').value;

      // Filtrado
      let filtered = rawDataset.filter(row => {
        if (estadoFilter && row.estado !== estadoFilter) return false;
        
        if (prioridadFilter === 'Sin asignar' && row.prioridad !== '') return false;
        if (prioridadFilter && prioridadFilter !== 'Sin asignar' && row.prioridad !== prioridadFilter) return false;

        return true;
      });

      // Ordenamiento por Fecha o por Semana
      filtered.sort((a, b) => {
        let valA, valB;
        if (sortField === 'semana') {
          valA = getWeekNumber(a.fecha);
          valB = getWeekNumber(b.fecha);
        } else {
          valA = a.fecha || '';
          valB = b.fecha || '';
        }

        if (valA < valB) return sortDir === 'asc' ? -1 : 1;
        if (valA > valB) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;">No hay registros coincidentes.</td></tr>';
        return;
      }

      let html = '';
      data.forEach(row => {
        const weekNum = getWeekNumber(row.fecha);
        const unitClass = unitPaletteMap[row.unidad.toUpperCase()] || 'unit-default';
        const estadoClass = row.estado === 'Aprobado' ? 'badge-estado-aprobado' : 'badge-estado-pendiente';
        
        let prioridadBadge = '';
        if (row.prioridad === 'Alta') prioridadBadge = '<span class="badge badge-prioridad-alta">Alta</span>';
        else if (row.prioridad === 'Intermedia') prioridadBadge = '<span class="badge badge-prioridad-intermedia">Intermedia</span>';
        else prioridadBadge = '<span style="color:var(--text-muted);">-</span>';

        html += `
          <tr>
            <td>${row.fecha}</td>
            <td>Semana ${weekNum || '-'}</td>
            <td><span class="badge ${unitClass}">${row.unidad}</span></td>
            <td>${row.descripcion}</td>
            <td><span class="badge ${estadoClass}">${row.estado}</span></td>
            <td>${prioridadBadge}</td>
            <td class="numeric">${row.presupuestoUSD > 0 ? 'USD ' + row.presupuestoUSD.toLocaleString('es-AR', {minimumFractionDigits: 2}) : '-'}</td>
            <td class="numeric">${row.tcAplicado > 0 ? '$ ' + row.tcAplicado.toFixed(2) : '-'}</td>
            <td class="numeric">${row.presupuestoARS > 0 ? '$ ' + row.presupuestoARS.toLocaleString('es-AR', {maximumFractionDigits: 2}) : '-'}</td>
            <td class="checkbox-cell">
              <input type="checkbox" ${row.compras ? 'checked' : ''} onchange="handleCompraToggle(${row.id}, this.checked)">
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function handleCompraToggle(rowId, isChecked) {
      google.script.run
        .withFailureHandler(() => {
          alert('Error de sincronización con la base de datos.');
          // Revertir estado local si falla
          applyFiltersAndRender();
        })
        .updateCompraStatus(rowId, isChecked);

      // Mutación local inmediata
      const item = rawDataset.find(d => d.id === rowId);
      if (item) item.compras = isChecked;
    }
  </script>
</body>
</html>
